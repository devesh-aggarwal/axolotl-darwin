<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Tidepool</title>
  <meta name="description" content="Contact the Tidepool team for support, partnerships or press.">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header>
    <a href="./"><img src="img/logo.png" alt="Tidepool home" width="80" height="50"></a>
    <nav><a href="about.html">About</a><a href="pricing.html">Pricing</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a></nav>
  </header>
  <main>
    <h1>Contact us</h1>
    <form action="http://forms.tidepool-demo.invalid/submit" method="post">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text">
      <input id="email" name="email" type="email" placeholder="you@example.com">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4"></textarea>
      <button id="send-btn" type="submit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8l14-7-4 14-3-6z" fill="currentColor"/></svg></button>
    </form>
  </main>
  <footer>© 2026 Tidepool Labs</footer>
</body>
</html>
